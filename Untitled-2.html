function chips(){const c=$("#chips");c.innerHTML="";[["Semua (100)",-1],...EN.map((e,i)=>[e.i+" "+e.n,i])].forEach(([t,v])=>{const d=mk("button","chip",t);d.setAttribute("aria-pressed",flt==v);d.onclick=()=>{flt=v;chips();render()};c.append(d)})}
